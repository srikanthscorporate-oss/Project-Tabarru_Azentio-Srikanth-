[project]
name = "claims"
version = "0.1.0"
description = "Claim packet intake agent for a synthetic Takaful operator (Project Tabarru)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.3",
    "pydantic>=2.7",
    "scikit-learn>=1.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by ruff format
